name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Detect and version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      apps: ${{ steps.script.outputs.apps }}
      sha: ${{ steps.script.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v4

      - name: Set up Node.js using .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect changes, bump versions, push
        id: script
        run: pnpm tsx scripts/release.ts

  build:
    name: Build ${{ matrix.app }}
    needs: version
    if: ${{ needs.version.outputs.apps != '[]' && needs.version.outputs.apps != '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        app: ${{ fromJson(needs.version.outputs.apps) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: ver
        run: |
          VERSION=$(node -p "require('./apps/${{ matrix.app }}/package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/lewis-wow/virtual-webauthn-authenticator/${{ matrix.app }}:${{ steps.ver.outputs.version }}
            ghcr.io/lewis-wow/virtual-webauthn-authenticator/${{ matrix.app }}:latest

      - name: Summarize published image
        run: |
          IMAGE="ghcr.io/lewis-wow/virtual-webauthn-authenticator/${{ matrix.app }}"
          VERSION="${{ steps.ver.outputs.version }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          PACKAGE_URL="https://github.com/lewis-wow/virtual-webauthn-authenticator/pkgs/container/virtual-webauthn-authenticator%2F${{ matrix.app }}"

          {
            echo "## ${{ matrix.app }} $VERSION"
            echo
            echo "- **Package:** [$PACKAGE_URL]($PACKAGE_URL)"
            echo "- **Digest:** \`$DIGEST\`"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
