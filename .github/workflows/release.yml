name: Release

on:
  push:
    tags:
      - '**/v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Parse app name and version from tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[a-z0-9-]+/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG (expected <app>/vX.Y.Z)" && exit 1
          fi
          APP="${TAG%%/v*}"
          VERSION="${TAG#*/}"
          echo "app=${APP}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ steps.parse.outputs.app }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/lewis-wow/virtual-webauthn-authenticator/${{ steps.parse.outputs.app }}:${{ steps.parse.outputs.version }}
            ghcr.io/lewis-wow/virtual-webauthn-authenticator/${{ steps.parse.outputs.app }}:latest

      - name: Summarize published image
        run: |
          IMAGE="ghcr.io/lewis-wow/virtual-webauthn-authenticator/${{ steps.parse.outputs.app }}"
          VERSION="${{ steps.parse.outputs.version }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          PACKAGE_URL="https://github.com/lewis-wow/virtual-webauthn-authenticator/pkgs/container/virtual-webauthn-authenticator%2F${{ steps.parse.outputs.app }}"

          {
            echo "## Published image"
            echo
            echo "- **Package:** [$PACKAGE_URL]($PACKAGE_URL)"
            echo "- **Digest:** \`$DIGEST\`"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
