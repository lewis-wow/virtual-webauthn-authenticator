name: Nx Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Only one release run should touch the chore/nx-release branch at a time; queue
# overlapping runs instead of letting them race on the same force-push/PR.
concurrency:
  group: nx-release
  cancel-in-progress: false

env:
  RELEASE_BRANCH: chore/nx-release
  GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Create release branch
        run: |
          git checkout -B "$RELEASE_BRANCH"
          # Reset the remote branch to the current master and establish upstream tracking so that
          # `nx release`'s own internal `git push` (a bare `git push --follow-tags`, no explicit
          # refspec) has somewhere to push to and never touches refs/heads/master.
          git push --force -u origin "$RELEASE_BRANCH"

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v4

      - name: Set up Node.js using .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Release
        run: pnpm exec nx release --skip-publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Open release pull request
        run: |
          if git diff --quiet origin/master HEAD; then
            echo "No release changes, nothing to open a PR for"
          else
            gh pr create \
              --base master \
              --head "$RELEASE_BRANCH" \
              --title "chore(release): version bump" \
              --body "Automated version bump and changelog update from \`nx release\`. The release tags have already been pushed and their GitHub Releases created; merge this PR to bring the version bump onto \`master\`." \
              || echo "A pull request for $RELEASE_BRANCH already exists"
          fi
