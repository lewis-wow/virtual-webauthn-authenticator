name: Node.js CI

on: [push]

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      DISABLE_ERD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v4

      - name: Set up Node.js using .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Restore Nx cache
        uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: nx-linux-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nx-linux-${{ github.ref_name }}-
            nx-linux-main-

      - name: Install dependencies
        run: pnpm install

      - name: Save pnpm store
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Check formatting
        run: pnpm format:check

      - name: Build project
        run: pnpm build

      - name: Run linter
        run: pnpm lint

      - name: Run check-types
        run: pnpm check-types

      - name: Save Nx cache (this run, for test job)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .nx/cache
          key: nx-linux-run-${{ github.run_id }}

      - name: Save Nx cache (branch, for future runs)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .nx/cache
          key: nx-linux-${{ github.ref_name }}-${{ github.run_id }}

  test:
    runs-on: ubuntu-latest
    needs: static
    env:
      DISABLE_ERD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v4

      - name: Set up Node.js using .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Restore Nx cache
        uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: nx-linux-run-${{ github.run_id }}
          restore-keys: |
            nx-linux-${{ github.ref_name }}-
            nx-linux-main-

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Start services with Docker Compose
        run: ./docker-compose-test.sh

      - name: Run database migrations
        env:
          ENVIRONMENT: test
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/prisma?schema=public'
        run: pnpm --filter @repo/prisma db:migrate

      - name: Run coverage
        env:
          ENVIRONMENT: test
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/prisma?schema=public'
        run: pnpm test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Stop services
        if: always()
        run: docker compose down
