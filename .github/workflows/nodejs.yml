name: Node.js CI

on: [push]

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      DISABLE_ERD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v4

      - name: Set up Node.js using .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-linux-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-linux-${{ github.ref_name }}-
            turbo-linux-main-

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm format:check

      - name: Build project
        run: pnpm build

      - name: Run linter
        run: pnpm lint

      - name: Run check-types
        run: pnpm check-types

  test:
    runs-on: ubuntu-latest
    needs: static
    env:
      DISABLE_ERD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v4

      - name: Set up Node.js using .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-linux-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-linux-${{ github.ref_name }}-
            turbo-linux-main-

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Start services with Docker Compose
        run: ./docker-compose-test.sh

      - name: Run database migrations
        env:
          ENVIRONMENT: test
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/prisma?schema=public'
        run: pnpm --filter @repo/prisma db:migrate

      - name: Run coverage
        env:
          ENVIRONMENT: test
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/prisma?schema=public'
        run: pnpm test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Stop services
        if: always()
        run: docker compose down
