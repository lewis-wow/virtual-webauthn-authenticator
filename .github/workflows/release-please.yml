name: Release Please

on:
  # Manually gated: push a fixed `release` branch (its content is irrelevant -
  # it just triggers this run; see scripts/release_trigger.ts / `pnpm
  # release:trigger`) to have release-please scan master's commit history and
  # open/update the release PR. It still always targets master (see
  # target-branch below) from its own auto-generated head branch, regardless
  # of which branch triggered the run. The `release` branch is deleted again
  # at the end of this job so it never lingers.
  push:
    branches:
      - 'release'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # The default GITHUB_TOKEN is deliberately prevented by GitHub from
          # triggering other workflows, so tags pushed here would never fire
          # release.yml's `on: push: tags:` trigger. A PAT avoids that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

      - name: Delete trigger branch
        # Only the `release` branch push should be cleaned up; a
        # workflow_dispatch run has no such branch to delete. `if: always()`
        # ensures cleanup happens even if release-please-action above fails.
        # Deleting a ref doesn't need the PAT's cross-workflow-triggering
        # power, so the default token (already granted contents: write above)
        # is enough here.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/release"
