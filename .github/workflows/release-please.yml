name: Release Please

on:
  # Manually gated: push a release/v*.*.* branch (the version in the branch
  # name itself is not read by anything - it just triggers this run) to have
  # release-please scan master's commit history and open/update the release
  # PR. It still always targets master (see target-branch below), regardless
  # of which branch triggered the run.
  push:
    branches:
      - 'release/v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # The default GITHUB_TOKEN is deliberately prevented by GitHub from
          # triggering other workflows, so tags pushed here would never fire
          # release.yml's `on: push: tags:` trigger. A PAT avoids that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master
